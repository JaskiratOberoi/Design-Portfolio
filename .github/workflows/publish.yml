name: Build and deploy to jaskiratoberoi.com

# jaskiratoberoi.com is hosted on Hostinger, which deploys the static files
# on the `hostinger-deploy` branch. This workflow builds the Vite site and
# publishes dist/ to that branch, then checks the live site picked it up.

on:
  push:
    branches:
      - master
      - redesign-v5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish dist/ to hostinger-deploy
        uses: s0/git-publish-subdir-action@v2.6.0
        env:
          REPO: self
          BRANCH: hostinger-deploy
          FOLDER: dist
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Deploy: ({sha}) {msg}"
          SKIP_EMPTY_COMMITS: true

      - name: Check the live site serves this build
        # Hostinger's Git auto-deploy usually picks the branch up within a
        # minute. This only warns; it never fails the deploy.
        continue-on-error: true
        run: |
          bundle=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          echo "Expecting $bundle on https://jaskiratoberoi.com"
          for i in $(seq 1 12); do
            if curl -fsSL "https://jaskiratoberoi.com/?deploy=${GITHUB_SHA}" | grep -q "$bundle"; then
              echo "Live site is serving this build."
              exit 0
            fi
            sleep 15
          done
          echo "::warning::jaskiratoberoi.com is not serving $bundle yet. If Hostinger auto-deploy is off, press Deploy for the hostinger-deploy branch in hPanel > Advanced > Git."
          exit 1
